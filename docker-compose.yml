# =============================================================================
# UAI.ZeroVP – multiple API instances with shared persistent JSON storage
#
#   docker compose up --build -d
#
# Instances:   http://localhost:5001   http://localhost:5002   http://localhost:5003
# Each instance returns its own instanceId on GET /api/info, while all of them
# read and write the same /data/todos.json file on the shared volume.
# =============================================================================

x-api: &api
  image: uai-zerovp-api:latest
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    TodoStorage__FilePath: /data/todos.json
    TodoStorage__SeedSampleData: "true"
    Swagger__Enabled: "true"
  volumes:
    - todo-data:/data   # same named volume in every instance = shared JSON file
  restart: unless-stopped

services:
  api-1:
    <<: *api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:8080"

  api-2:
    <<: *api
    depends_on:
      - api-1           # api-1 builds the image, the others reuse it
    ports:
      - "5002:8080"

  api-3:
    <<: *api
    depends_on:
      - api-1
    ports:
      - "5003:8080"

volumes:
  todo-data: