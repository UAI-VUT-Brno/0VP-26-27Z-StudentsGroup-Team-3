
name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'

jobs:
  build-and-test:
    name: Build, Audit and Test (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore and audit NuGet dependencies
        run: >
          dotnet restore UAI.ZeroVP.sln
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=low
          -warnaserror:NU1900,NU1901,NU1902,NU1903,NU1904,NU1905

      - name: Build solution
        run: dotnet build UAI.ZeroVP.sln --no-restore --configuration Release

      - name: Run unit & integration tests
        run: dotnet test UAI.ZeroVP.sln --no-build --configuration Release --verbosity normal
